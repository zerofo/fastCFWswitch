
---
name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - rewrite

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64

    steps:
    - name: Checkout project
      uses: actions/checkout@master
      with:
        submodules: recursive

    - name: Build project
      run: |
          git config --global --add safe.directory '*' 
          git submodule update --init --remote 
          make -C libs/libnx install -j2
          # devkitA64 GCC15/binutils2.45 下 libnx specs 的 -z text 会误报
          # "read-only segment has dynamic relocations",去掉该选项生成本地 specs
          sed 's/ -z text//' $DEVKITPRO/libnx/switch.specs > switch_local.specs
          make 
          mkdir -p switch/.overlays/
          cp *.ovl switch/.overlays/
          zip -r fastCFWSwitch.zip switch
          
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        path: fastCFWSwitch.zip   
    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.release_token }}
        file: fastCFWSwitch.zip
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true
        make_latest: true 
        release_name: ${{ github.event.repository.updated_at }}
